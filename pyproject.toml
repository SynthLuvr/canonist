[project]
name = "canonist"
version = "0.2.0"
description = "An opinionated Python toolchain as one versioned dependency: lint, format, test, doctor, migrate"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
# The bundled tools are hard dependencies on purpose: Python dependency
# groups are not transitive, so a dev-group here would not reach consumers.
# Every tool moves in lockstep with this package's version.
dependencies = [
    "pip-audit>=2.10.1",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]

[project.optional-dependencies]
# Poe stays consumer-side: it is the shell around the tools, not a tool.
dev = [
    "poethepoet>=0.48.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canonist"]

# --- Self-host: this repo consumes its own presets (see README) -----------

# Editor parity only; `python -m canonist lint` generates the effective config.
[tool.pyright]
extends = "src/canonist/presets/pyright.base.json"

# Local deltas over the bundled presets (this is the consumer override
# mechanism, applied to ourselves: preset values deep-merge, lists replace).
[tool.canonist.ruff.lint.isort]
known-first-party = ["canonist"]

[tool.canonist.ruff.lint.per-file-ignores]
# The runner and the ported gates spawn subprocesses by design.
"src/canonist/lib/runner.py" = ["S404", "S603"]
"src/canonist/lib/audit_deps.py" = ["S404", "S603"]
# duplo downloads, extracts, and executes a pinned binary by design.
"src/canonist/lib/duplo.py" = ["S"]

[tool.poe.tasks.lint]
help = "Full static pipeline (format check, lint, typecheck, lock, audit, dupes)"
cmd = "python -m canonist lint"

[tool.poe.tasks.format]
help = "Auto-format and auto-fix lint issues (writes changes)"
cmd = "python -m canonist format"

[tool.poe.tasks.test]
help = "Run the test suite with the 80% coverage gate"
cmd = "python -m canonist test"

[tool.poe.tasks.doctor]
help = "Diagnose the environment, bundled tools, and generated configs"
cmd = "python -m canonist doctor"

[tool.poe.tasks.check]
help = "Everything: the full lint pipeline plus the test suite"
sequence = ["lint", "test"]
