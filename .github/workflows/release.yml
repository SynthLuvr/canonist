name: Release

# Manually dispatched release: full check → version bump → publish to PyPI
# via OIDC trusted publishing (no PyPI token is stored) → version-bump PR →
# vX.Y.Z tag and GitHub release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Exact version to publish (e.g. 0.3.0). Leave blank to apply the
          semver bump selected below.
        required: false
        default: ""
      bump:
        description: Semver bump to apply (ignored when an exact version is given).
        type: choice
        options: [patch, minor, major]
        default: patch
      notes:
        description: >-
          Release notes — call out gate/rule changes per the semver policy in
          README.md. Appended to the GitHub release body.
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  id-token: write  # PyPI OIDC trusted publishing

# Releases mutate the repo and PyPI: run one at a time, never cancel mid-flight.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Keep tags and PyPI aligned with what's on main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The PyPI trusted publisher is registered against the `pypi` environment,
    # so the OIDC claim must carry it.
    environment: pypi
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.0.1

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --all-extras --locked

      - name: "Full check (dogfood: canonist lints and tests itself)"
        run: uv run python -m poethepoet check

      # `uv version` writes pyproject.toml AND re-locks uv.lock, so CI's
      # `--locked` install keeps passing.
      - name: Bump version
        env:
          VERSION_INPUT: ${{ inputs.version }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          semver='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if [ -z "$VERSION_INPUT" ]; then
            uv version --bump "$BUMP" >/dev/null
          elif grep -Eq "$semver" <<<"$VERSION_INPUT"; then
            uv version "$VERSION_INPUT"
          else
            echo "::error::'$VERSION_INPUT' is not a valid semver version"
            exit 1
          fi
          echo "NEW_VERSION=$(uv version --short)" >> "$GITHUB_ENV"

      # A run that published but failed later can be re-dispatched to finish
      # the PR/tag/release bookkeeping instead of failing on the existing upload.
      - name: Check if already published
        id: published
        run: |
          if curl -sf "https://pypi.org/pypi/canonist/${NEW_VERSION}/json" >/dev/null; then
            echo "::notice::canonist ${NEW_VERSION} is already on PyPI; skipping publish"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build distribution
        if: steps.published.outputs.exists != 'true'
        run: uv build

      - name: Publish to PyPI
        if: steps.published.outputs.exists != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

      # The bump lands on main the way every commit here does: a squash-merged
      # PR. Requires the repo setting "Allow GitHub Actions to create and
      # approve pull requests"; without it gh pr create fails. Re-runnable:
      # this workflow owns release/* branches, so force-push supersedes a
      # stale branch and an already-open PR is reused.
      - name: Open and merge version-bump PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # checkout left HEAD detached; -B carries the bump onto a release branch.
          branch="release/v${NEW_VERSION}"
          git checkout -B "$branch"
          git add pyproject.toml uv.lock
          git commit -m "Bump version to ${NEW_VERSION}"
          git push --force origin "$branch"
          pr_url="$(gh pr list --head "$branch" --state open --json url --jq '.[0].url')"
          if [ -z "$pr_url" ]; then
            pr_url="$(gh pr create --base main --head "$branch" \
              --title "Bump version to ${NEW_VERSION}" \
              --body "Automated version bump for the v${NEW_VERSION} release (canonist ${NEW_VERSION} is on PyPI).")"
          fi
          if [ "$(gh pr view "$pr_url" --json state --jq .state)" = "OPEN" ]; then
            gh pr merge "$pr_url" --squash --delete-branch
          fi
          echo "MERGE_SHA=$(gh pr view "$pr_url" --json mergeCommit --jq .mergeCommit.oid)" >> "$GITHUB_ENV"

      # Tag only after PyPI accepted the package, so a failed publish never
      # leaves an orphan tag or release. MERGE_SHA is born on the server by the
      # squash merge and is not in this depth-1 clone — fetch before tagging.
      # Existing tag/release are tolerated so a re-run that only failed here
      # can finish.
      - name: Tag and create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          main_sha="$(git rev-parse origin/main)"
          if [ "$main_sha" != "$MERGE_SHA" ]; then
            echo "::error::origin/main (${main_sha}) is no longer the release merge (${MERGE_SHA}); refusing to tag the wrong commit"
            exit 1
          fi
          if git ls-remote --exit-code origin "refs/tags/v${NEW_VERSION}" >/dev/null 2>&1; then
            echo "::notice::tag v${NEW_VERSION} already exists; skipping tag push"
          else
            git tag "v${NEW_VERSION}" "${MERGE_SHA}"
            git push origin "v${NEW_VERSION}"
          fi
          if gh release view "v${NEW_VERSION}" >/dev/null 2>&1; then
            echo "::notice::release v${NEW_VERSION} already exists; skipping"
          else
            body="Published canonist ${NEW_VERSION} to PyPI: https://pypi.org/pypi/canonist/${NEW_VERSION}/"
            if [ -n "$RELEASE_NOTES" ]; then
              body="$(printf '%s\n\n%s' "$body" "$RELEASE_NOTES")"
            fi
            gh release create "v${NEW_VERSION}" \
              --title "v${NEW_VERSION}" \
              --notes "$body"
          fi
